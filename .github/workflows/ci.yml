name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    # On-prem runner pool first (cron-runner2: see molecular-man-org/ai-studio docs/CI_RUNNERS.md); the free
    # GitHub-hosted runner also works, so reverting this one line is always safe.
    runs-on: [self-hosted, Linux, X64]
    strategy:
      matrix:
        node-version: [18.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Unit tests with per-file branch coverage gate (80%)
        run: npm run coverage

  lint:
    name: Lint (JSON / Markdown / YAML / TOML)
    # On-prem runner pool first (cron-runner2: see molecular-man-org/ai-studio docs/CI_RUNNERS.md); the free
    # GitHub-hosted runner also works, so reverting this one line is always safe.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
